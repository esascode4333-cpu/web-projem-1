<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampüs Etkinlikleri</title>
    <link rel="stylesheet" href="css/2311012055.css">
    <script type="module" src="js/event-list.js"></script>

<body>
    <header>
        <h1>Kampüs Etkinlikleri</h1>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="etkinlikler.html">Etkinlikler</a></li>
                <li><a href="etkinlik-ekle.html">Ekle</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <!-- Arama ve Kategori (Fotoğraftaki gibi alt alta ve tam genişlik) -->
        <form id="filtre-formu" style="display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
            <input type="search" id="arama" style="width:100%; padding: 0.75rem; border:1px solid #ccc; border-radius:4px; font-family: inherit;" placeholder="Etkinlik ara...">
            <select id="kategori-filtre" style="width:100%; padding: 0.75rem; border:1px solid #ccc; border-radius:4px; font-family: inherit; color: #555;">
                <option value="">Tüm Kategoriler</option>
            </select>
        </form>
        
        <p id="sonuc" style="font-size: 0.9rem; color: #555; margin-bottom: 1rem;"></p>
        
        <!-- Etkinlik Kartları Grid -->
        <section id="etkinlik-listesi" class="grid-3"></section>
    </main>
    <footer>
        <p>Selim Aydın - 2311012055 - 2026</p>
    </footer>
